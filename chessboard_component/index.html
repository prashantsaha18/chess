<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
        .chess-board { 
            display: grid; 
            grid-template-columns: 22px repeat(8, 58px); 
            grid-template-rows: repeat(8, 58px) 22px; 
            border: 3px solid #c9a84c; 
            border-radius: 4px; 
            overflow: hidden; 
            box-shadow: 0 8px 40px rgba(0,0,0,.7); 
            width: fit-content;
        }
        .chess-cell { 
            width: 58px; 
            height: 58px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.9rem; 
            cursor: pointer; 
            user-select: none; 
            position: relative; 
        }
        .chess-cell:hover { 
            filter: brightness(1.15); 
        }
        .rank-lbl, .file-lbl { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: .68rem; 
            color: #c9a84c; 
            font-family: 'IBM Plex Mono', monospace; 
            font-weight: 600; 
            background: #1a1410; 
        }
        .hint-dot::after { 
            content: ''; 
            position: absolute; 
            width: 18px; 
            height: 18px; 
            border-radius: 50%; 
            background: rgba(0,160,0,.4); 
        }
        .hint-cap::after { 
            content: ''; 
            position: absolute; 
            inset: 0; 
            border: 4px solid rgba(0,180,0,.5); 
            border-radius: 50%; 
        }
    </style>
</head>
<body>
    <div id="board-container"></div>
    <script>
        // Notify Streamlit that the component is ready
        window.parent.postMessage({
            isStreamlitMessage: true,
            type: "streamlit:componentReady",
            apiVersion: 1
        }, "*");

        // Function called when a chess cell is clicked
        window.handleClick = (sq) => {
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: "streamlit:setComponentValue",
                value: sq
            }, "*");
        };

        // Listen for board updates from Streamlit
        window.addEventListener("message", (event) => {
            const data = event.data;
            if (data.type === "streamlit:render") {
                const args = data.args;
                if (args && args.html) {
                    document.getElementById("board-container").innerHTML = args.html;
                }
                
                // Adjust iframe height to avoid scrolling or clipping
                const bodyHeight = document.body.scrollHeight;
                window.parent.postMessage({
                    isStreamlitMessage: true,
                    type: "streamlit:setFrameHeight",
                    height: bodyHeight
                }, "*");
            }
        });
    </script>
</body>
</html>
